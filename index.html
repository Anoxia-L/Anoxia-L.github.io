<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>给雷佳颖小朋友</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07060d;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  #sky{position:fixed;inset:0;display:block}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 14px;text-align:center;z-index:2}
  .line{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease}
  .line.show{opacity:1;transform:translateY(0)}
  .name{font-size:15px;letter-spacing:6px;color:#ffb7d5;opacity:0;transition:opacity 1.4s ease 0.2s;margin-bottom:20px;text-shadow:0 0 18px rgba(255,120,180,.55)}
  .name.show{opacity:.9}
  .heart-title{
    font-weight:800;line-height:1.3;letter-spacing:1px;
    background:linear-gradient(100deg,#ff8fc7 0%,#ffd6e8 32%,#fff 50%,#ffd6e8 68%,#ff7ab8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,90,170,.5));
    animation:shine 4.5s ease-in-out infinite;background-size:220% 100%
  }
  @keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .heart-title .t1{font-size:min(13vw,58px);display:inline-block}
  .heart-title .t2{font-size:min(9.6vw,44px);display:inline-block;white-space:nowrap;letter-spacing:2px}
  .sub{margin-top:18px;font-size:13px;color:#c9b6d8;letter-spacing:2px;line-height:2;opacity:0;transition:opacity 1.2s ease}
  .sub.show{opacity:.85}
  .tap{margin-top:34px;padding:12px 30px;border-radius:999px;border:1px solid rgba(255,140,190,.55);
    background:radial-gradient(circle at 30% 20%,rgba(255,120,180,.28),rgba(255,120,180,.06));
    color:#ffd6e8;font-size:14px;letter-spacing:3px;opacity:0;transition:opacity 1s ease,transform .25s ease;backdrop-filter:blur(6px)}
  .tap.show{opacity:1;animation:breathe 2.6s ease-in-out infinite}
  .tap:active{transform:scale(.94)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,110,175,.35)}50%{box-shadow:0 0 28px 8px rgba(255,110,175,.16)}}
  .big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
  .bigtext{font-size:min(13vw,54px);font-weight:800;letter-spacing:4px;color:#fff;opacity:0;transform:scale(.6);
    text-shadow:0 0 30px rgba(255,100,170,.9),0 0 70px rgba(255,60,150,.55);transition:all 1.1s cubic-bezier(.22,1.4,.4,1)}
  .bigtext.show{opacity:1;transform:scale(1)}
  .scroll-hint{position:fixed;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:#8a7a99;letter-spacing:3px;opacity:0;transition:opacity 1.2s ease;z-index:4}
  .scroll-hint.show{opacity:.8}
  .card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:22px;overflow-y:auto;background:rgba(7,5,12,.97);opacity:0;pointer-events:none;transition:opacity .6s ease}
  .card.show{opacity:1;pointer-events:auto}
  .card-inner{max-width:420px;width:100%;border-radius:22px;padding:30px 26px;text-align:left;
    background:linear-gradient(160deg,rgba(32,18,40,.98),rgba(24,10,30,.98));border:1px solid rgba(255,160,200,.35);
    box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .card-inner h2{font-size:19px;color:#ffd6e8;margin-bottom:16px;letter-spacing:2px}
  .card-inner p{font-size:14.5px;color:#f2e9f7;line-height:2.05;margin-bottom:10px}
  .card-inner .sign{margin-top:18px;text-align:right;color:#ff9fc8;font-size:13px;letter-spacing:2px}
  .card-inner button{margin-top:22px;width:100%;padding:13px;border-radius:14px;border:none;font-size:15px;letter-spacing:2px;
    color:#3b0a22;background:linear-gradient(100deg,#ffb3d1,#ff8fc0);font-weight:700}
  .glow-heart{position:fixed;z-index:1;pointer-events:none;width:16px;height:16px;opacity:0;transform:translate(-50%,-50%)}
  .fx{position:fixed;z-index:3;pointer-events:none;font-size:20px;will-change:transform,opacity}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <div class="name" id="name">致 · 雷佳颖</div>
  <div class="line" id="l1"><div class="heart-title"><span class="t1">我爱你</span><br><span class="t2">雷佳颖小朋友</span></div></div>
  <div class="sub line" id="l2">和你在一起，日子都是甜的<br>今天就把这句话，再说给你听</div>
  <button class="tap" id="tap" style="border:1px solid rgba(255,140,190,.55);background:radial-gradient(circle at 30% 20%,rgba(255,120,180,.28),rgba(255,120,180,.06))">点 我</button>
  <div class="scroll-hint" id="hint">（轻触屏幕，会有小心心）</div>
</div>
<div class="big" id="big"><div class="bigtext" id="bigtext">我喜欢你</div></div>
<div class="card" id="card">
  <div class="card-inner">
    <h2>小朋友，见字如面</h2>
    <p>不是今天才这么爱你 —— 是一直都这么爱你。</p>
    <p>从在一起那天起我就知道，喜欢你不是一时兴起，是日复一日地觉得「还是你最好」。</p>
    <p>这些年你陪我走过的路，我都记着。你笑起来眼睛弯弯的样子，说话软软的语气，我看了这么久，还是看不够。</p>
    <p>今天比昨天更爱你一点，明天比今天，还要再多一点。</p>
    <p>雷佳颖小朋友，我爱你。<br>而且会越来越爱，越来越会爱。</p>
    <p>日子还长，我哪儿也不去，就一直在你身边。</p>
    <div class="sign">—— 一直在爱你、并且越来越爱你的我</div>
    <button onclick="closeCard()">嗯，我知道</button>
  </div>
</div>
<script>
(function(){
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize(); addEventListener('resize', resize);

  // 星空 + 爱心粒子
  const stars=[], hearts=[], bursts=[];
  for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random(),s:Math.random()*.03+.01});
  for(let i=0;i<14;i++) hearts.push({x:Math.random()*W,y:H+Math.random()*H,v:Math.random()*.35+.12,s:Math.random()*8+5,a:Math.random()*.5+.25,ph:Math.random()*6.28});

  function drawHeart(x,y,size,color,alpha,rot){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(size/16,size/16);
    ctx.beginPath();
    ctx.moveTo(0,5);ctx.bezierCurveTo(0,2,-6,-2,-6,-8);ctx.bezierCurveTo(-6,-14,0,-15,0,-9);
    ctx.bezierCurveTo(0,-15,6,-14,6,-8);ctx.bezierCurveTo(6,-2,0,2,0,5);ctx.closePath();
    ctx.fillStyle='rgba('+color+','+alpha+')';ctx.fill();ctx.restore();
  }
  function loop(t){
    ctx.clearRect(0,0,W,H);
    // 背景光晕
    const g=ctx.createRadialGradient(W/2,H*.42,10,W/2,H*.42,Math.max(W,H)*.72);
    g.addColorStop(0,'rgba(70,30,80,.35)');g.addColorStop(.55,'rgba(24,10,32,.15)');g.addColorStop(1,'rgba(7,6,13,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 星星
    for(const s of stars){s.a+=s.s;const a=.35+.35*Math.sin(s.a*3);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle='rgba(255,230,245,'+(a*.8)+')';ctx.fill();}
    // 上升爱心
    for(const h of hearts){
      h.y-=h.v; h.x+=Math.sin((t/2200)+h.ph)*.25; if(h.y<-30){h.y=H+20;h.x=Math.random()*W;}
      drawHeart(h.x,h.y,h.s,'255,120,180',h.a,Math.sin(t/1600+h.ph)*.15);
    }
    // 点击爆发的爱心
    for(let i=bursts.length-1;i>=0;i--){
      const p=bursts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.012;p.rot+=p.vr;
      if(p.life<=0){bursts.splice(i,1);continue;}
      drawHeart(p.x,p.y,p.s*p.life,'255,'+Math.floor(150+p.life*80)+',200',Math.max(0,p.life),p.rot);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 文字动画序列
  const dim=document.getElementById('name'), l1=document.getElementById('l1'), l2=document.getElementById('l2'),
        tap=document.getElementById('tap'), hint=document.getElementById('hint');
  const DL = Math.max(0, parseInt(new URLSearchParams(location.search).get('delay')||'0',10)||0) * 1000;
  setTimeout(()=>dim.classList.add('show'), DL+300);
  setTimeout(()=>l1.classList.add('show'), DL+1100);
  setTimeout(()=>l2.classList.add('show'), DL+2200);
  setTimeout(()=>tap.classList.add('show'), DL+3000);
  setTimeout(()=>hint.classList.add('show'), DL+3800);

  // 音效：WebAudio 合成一段温柔的和弦琶音（无外部文件）
  let actx=null;
  function playMusic(){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const notes=[523.25,659.25,783.99,1046.5,783.99,659.25,587.33,698.46,880,1174.66,880,698.46];
      const t0=actx.currentTime+0.05;
      notes.forEach((f,i)=>{
        const o=actx.createOscillator(), gn=actx.createGain();
        o.type='sine'; o.frequency.value=f;
        const st=t0+i*0.42, dur=1.5;
        gn.gain.setValueAtTime(0,st); gn.gain.linearRampToValueAtTime(0.10,st+0.06);
        gn.gain.exponentialRampToValueAtTime(0.0008,st+dur);
        o.connect(gn).connect(actx.destination); o.start(st); o.stop(st+dur+0.1);
      });
    }catch(e){}
  }

  // 点击特效
  function burst(x,y,n){
    for(let i=0;i<(n||16);i++){
      const ang=Math.random()*Math.PI*2, sp=Math.random()*3.4+1.2;
      bursts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:1,s:Math.random()*10+6,rot:Math.random()*6.28,vr:(Math.random()-.5)*.15});
    }
  }
  document.body.addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(t) burst(t.clientX,t.clientY,10);
  },{passive:true});
  document.body.addEventListener('mousedown',e=>burst(e.clientX,e.clientY,10));

  // 点我：放大文字 + 展示卡片
  let opened=false;
  tap.addEventListener('click', e=>{
    e.stopPropagation();
    playMusic();
    burst(innerWidth/2, innerHeight*0.45, 60);
    const big=document.getElementById('big'), bigtext=document.getElementById('bigtext');
    bigtext.textContent='雷佳颖，我爱你';
    bigtext.classList.add('show');
    setTimeout(()=>{bigtext.classList.remove('show'); openCard();}, 1700);
  });
  function openCard(){ document.getElementById('card').classList.add('show'); }
  window.closeCard=function(){ document.getElementById('card').classList.remove('show'); burst(innerWidth/2,innerHeight/2,40); playMusic(); };
})();
</script>
</body>
</html>
